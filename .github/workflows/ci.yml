name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders: the build only needs well-formed values.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:api-client
      - run: pnpm build
      # The deployable artifact: a clean build carries no .env secrets and fits Wrangler's checks.
      - name: Build the Cloudflare Worker
        working-directory: apps/web
        run: |
          pnpm exec opennextjs-cloudflare build
          node scripts/check-worker-env.mjs
          pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      # Only Postgres is needed for migrations, pgTAP and type generation.
      - run: supabase db start
      - run: supabase db lint --level warning --fail-on error
      - run: pnpm db:test
      - run: pnpm check:db-types

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      # Auth, REST, Storage (AI uploads) and Postgres: signed-in tests use a test user, not Google.
      - run: supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,realtime,postgres-meta,mailpit
      - name: Use the local Supabase keys
        run: |
          supabase status -o json | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const j = JSON.parse(s.slice(s.indexOf("{")));
              console.log(`NEXT_PUBLIC_SUPABASE_URL=${j.API_URL}`);
              console.log(`NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${j.PUBLISHABLE_KEY}`);
              console.log(`E2E_SUPABASE_SECRET_KEY=${j.SECRET_KEY}`);
            });' >> "$GITHUB_ENV"
      # E2E runs on the Worker, the runtime that is deployed (Wrangler's local workerd).
      - run: pnpm --filter @elacharger/web exec opennextjs-cloudflare build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_RUNTIME: cloudflare
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
