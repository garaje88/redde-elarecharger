<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Elacharger · Agregar cargador</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F5A00}a:hover{color:#2E4200}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F6F1; font-family: Inter, system-ui, sans-serif; color: #0E1116; box-sizing: border-box; padding: 52px 16px 0 16px; display: flex; flex-direction: column; gap: 12px">
  <header style="display: flex; align-items: center; gap: 12px">
    <a href="Garage.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3E6E1; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1116" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Agregar cargador</h1>
  </header>

  <div role="tablist" aria-label="Dónde cargas" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #E7EAE4; border-radius: 14px; padding: 4px; gap: 4px">
    <button type="button" role="tab" aria-selected="{{ homeSel }}" onClick="{{ goHome }}" style="min-height: 40px; border: 0; border-radius: 10px; background: {{ homeBg }}; font: inherit; font-size: 14px; font-weight: 600; color: #0E1116">En casa</button>
    <button type="button" role="tab" aria-selected="{{ pubSel }}" onClick="{{ goPub }}" style="min-height: 40px; border: 0; border-radius: 10px; background: {{ pubBg }}; font: inherit; font-size: 14px; font-weight: 600; color: #0E1116">Estación pública</button>
  </div>

  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
    <label for="cq" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #D3D8D0; background: #FFFFFF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6470" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="cq" value="[MARCA] wallbox 7" aria-label="Buscar cargador por marca y modelo" style="flex: 1; border: 0; font: inherit; font-size: 15px; outline: none; background: transparent">
    </label>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <button type="button" style="min-height: 60px; border-radius: 14px; border: 2px solid #3F5A00; background: #FFFFFF; font: inherit; text-align: left; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; color: #0E1116">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 15px">[MARCA] Wallbox 7 kW</span><span style="font-size: 13px; color: #5B6470">Monofásico · 32 A máx · Tipo 2 · catálogo</span></span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600">7,4 kW</span>
      </button>
      <button type="button" style="min-height: 60px; border-radius: 14px; border: 1px solid #E3E6E1; background: #FFFFFF; font: inherit; text-align: left; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; color: #0E1116">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 15px">Cargador portátil del carro</span><span style="font-size: 13px; color: #5B6470">Según la ficha de tu vehículo</span></span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600">—</span>
      </button>
    </div>

    <fieldset style="margin: 0; padding: 14px 16px; border: 1px solid #E3E6E1; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
      <legend style="font-size: 13px; font-weight: 600; color: #5B6470; padding: 0 4px">Voltaje de entrada en tu casa</legend>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{ volts }}" as="v" hint-placeholder-count="5">
          <button type="button" onClick="{{ v.pick }}" aria-pressed="{{ v.pressed }}" style="min-height: 40px; min-width: 56px; padding: 0 10px; border-radius: 10px; border: 1px solid {{ v.border }}; background: {{ v.bg }}; color: {{ v.fg }}; font: inherit; font-size: 14px; font-weight: 600">{{ v.label }}</button>
        </sc-for>
      </div>
      <label for="amp" style="display: flex; justify-content: space-between; align-items: center; font-size: 14px">Amperaje del circuito
        <input id="amp" value="32 A" style="width: 84px; min-height: 40px; border-radius: 10px; border: 1px solid #D3D8D0; padding: 0 10px; font: inherit; font-size: 14px; text-align: right">
      </label>
      <div aria-live="polite" style="background: #F1F8D9; border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 13px; color: #3F5A00">{{ note }}</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">{{ kw }}</span>
      </div>
    </fieldset>
  </sc-if>

  <sc-if value="{{ isPub }}" hint-placeholder-val="{{ false }}">
    <span style="font-size: 13px; color: #5B6470">Tipo de conector (datos de referencia de Open Charge Map)</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="min-height: 60px; border-radius: 14px; border: 2px solid #3F5A00; background: #FFFFFF; font: inherit; text-align: left; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; color: #0E1116"><span style="font-weight: 600">CCS2</span><span style="font-size: 12px; color: #5B6470">DC · compatible</span></button>
      <button type="button" style="min-height: 60px; border-radius: 14px; border: 1px solid #E3E6E1; background: #FFFFFF; font: inherit; text-align: left; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; color: #0E1116"><span style="font-weight: 600">Tipo 2</span><span style="font-size: 12px; color: #5B6470">AC · compatible</span></button>
      <button type="button" style="min-height: 60px; border-radius: 14px; border: 1px solid #E3E6E1; background: #FFFFFF; font: inherit; text-align: left; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; color: #0E1116"><span style="font-weight: 600">CHAdeMO</span><span style="font-size: 12px; color: #B45309">No compatible</span></button>
      <button type="button" style="min-height: 60px; border-radius: 14px; border: 1px solid #E3E6E1; background: #FFFFFF; font: inherit; text-align: left; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; color: #0E1116"><span style="font-weight: 600">GB/T</span><span style="font-size: 12px; color: #5B6470">Requiere adaptador</span></button>
    </div>
    <label for="pkw" style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; background: #FFFFFF; border: 1px solid #E3E6E1; border-radius: 14px; padding: 8px 14px">Potencia de la estación
      <input id="pkw" value="60 kW" style="width: 84px; min-height: 40px; border-radius: 10px; border: 1px solid #D3D8D0; padding: 0 10px; font: inherit; font-size: 14px; text-align: right">
    </label>
    <span style="font-size: 12px; color: #5B6470">La compatibilidad sale de los conectores de tu vehículo en el catálogo.</span>
  </sc-if>

  <div style="margin-top: auto; margin-bottom: 28px; display: flex; flex-direction: column; gap: 8px">
    <a href="Garage.dc.html" style="min-height: 52px; border-radius: 16px; background: #3F5A00; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Guardar cargador</a>
    <button type="button" style="min-height: 44px; border-radius: 14px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #3F5A00">No encuentro mi cargador: buscar con IA</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'home', v: 220 };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var list = [110, 120, 208, 220, 240];
    var volts = list.map(function (n) {
      var sel = st.v === n;
      return { label: n + ' V', pressed: sel ? 'true' : 'false', bg: sel ? '#0E1116' : '#FFFFFF', fg: sel ? '#FFFFFF' : '#0E1116', border: sel ? '#0E1116' : '#D3D8D0', pick: function () { self.setState({ v: n }); } };
    });
    var amps = st.v <= 120 ? 12 : 32;
    var raw = st.v * amps / 1000;
    var kw = Math.min(raw, 7.4);
    var note = st.v <= 120 ? 'Toma doméstica · ' + amps + ' A máx. típico' : 'Mín. entre cargador (7,4 kW) y circuito (' + raw.toFixed(1).replace('.', ',') + ' kW)';
    return {
      isHome: st.tab === 'home',
      isPub: st.tab === 'pub',
      homeSel: st.tab === 'home' ? 'true' : 'false',
      pubSel: st.tab === 'pub' ? 'true' : 'false',
      homeBg: st.tab === 'home' ? '#FFFFFF' : 'transparent',
      pubBg: st.tab === 'pub' ? '#FFFFFF' : 'transparent',
      goHome: function () { self.setState({ tab: 'home' }); },
      goPub: function () { self.setState({ tab: 'pub' }); },
      volts: volts,
      kw: kw.toFixed(1).replace('.', ',') + ' kW',
      note: note
    };
  }
}
</script>
</body>
</html>
